# Tool versions shared by humans, CI and the factory's agents and gates.
# `mise install` installs them; the Makefile targets use them unchanged.
# golangci-lint, mockery and sqlc match the versions CI uses.
[tools]
go = "1.25.5"
bun = "1.4.4"
# Node runs vitest and the Bruno CLI; vitest 5 and jsdom 31 need Node 22.12+ or 24.15+.
node = "24.22.3"
# The Bruno CLI runs the API suite in api/ (mise run e2e).
"npm:@usebruno/cli" = "4.3.0"
golangci-lint = "2.8.0"
mockery = "3.6.1"
sqlc = "1.30.0"

# The factory's command gates run `mise run lint` and `mise run test`.
[tasks."deps:frontend"]
description = "Install frontend dependencies from bun.lock"
dir = "frontend"
run = "bun install --frozen-lockfile"

# go-packages.txt describes the factory's build platform (linux/amd64), not the
# machine running the task, so deps:list and deps:check give the same result on
# every machine. Building, testing and running the app keep the local platform.
[tasks."deps:list"]
description = "Regenerate go-packages.txt (third-party Go packages the module imports)"
env = { GOOS = "linux", GOARCH = "amd64" }
run = """
go list -deps -test -f '{% raw %}{{if and (not .Standard) .Module (not .Module.Main)}}{{.ImportPath}}{{end}}{% endraw %}' ./... | grep -v '^$' | sort -u > go-packages.txt
"""

[tasks."deps:check"]
description = "Fail when go-packages.txt is out of date (run mise run deps:list)"
# Same pinned platform as deps:list (linux/amd64).
env = { GOOS = "linux", GOARCH = "amd64" }
run = """
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
go list -deps -test -f '{% raw %}{{if and (not .Standard) .Module (not .Module.Main)}}{{.ImportPath}}{{end}}{% endraw %}' ./... | grep -v '^$' | sort -u > "$tmp"
diff -u go-packages.txt "$tmp" || { echo "go-packages.txt is out of date: run 'mise run deps:list'" >&2; exit 1; }
"""

# Run by the factory in a directory holding only the files declared in
# .factory/config.yaml, so it must not need the repo's code.
[tasks."deps:warm"]
description = "Download and pre-compile Go and Bun dependencies"
depends = ["deps:frontend"]
run = """
go mod download
grep -v '^$' go-packages.txt | xargs go build
"""

[tasks.lint]
description = "Lint backend and frontend (make lint)"
depends = ["deps:frontend", "deps:check"]
run = "make lint"

[tasks.test]
description = "Run unit tests (make test)"
run = "make test"

# The API suite against a running server: the local one by default, or the
# stage the factory verifies a release on (E2E_BASE_URL). Results are JUnit
# XML at E2E_RESULTS, which the factory reads; a failing assertion fails it.
[tasks."e2e:local"]
description = "Start the server from this checkout on a fresh database and run the API suite against it (the factory's e2e gate)"
run = """
set -eu
tmp=$(mktemp -d)
port=${E2E_LOCAL_PORT:-18080}
pid=""
cleanup() { [ -n "$pid" ] && kill "$pid" 2>/dev/null || true; rm -rf "$tmp"; }
trap cleanup EXIT
go build -o "$tmp/goodreads" ./cmd/goodreads
DATABASE_PATH="$tmp/e2e.db" go run ./cmd/migrate
DATABASE_PATH="$tmp/e2e.db" SERVER_ADDR="127.0.0.1:$port" "$tmp/goodreads" > "$tmp/server.log" 2>&1 &
pid=$!
ready=""
for i in $(seq 1 60); do
  if curl -fsS "http://127.0.0.1:$port/api/ready" > /dev/null 2>&1; then ready=1; break; fi
  sleep 0.5
done
if [ -z "$ready" ]; then echo "the server did not become ready; its log:"; tail -n 50 "$tmp/server.log"; exit 1; fi
if ! E2E_BASE_URL="http://127.0.0.1:$port" mise run e2e; then
  # Every request is logged; show the errors and server errors, which say why.
  echo "--- the server's errors and 5xx responses:"
  grep -E 'ERROR|WARN|panic|status=5[0-9][0-9]' "$tmp/server.log" | tail -n 40 || tail -n 20 "$tmp/server.log"
  exit 1
fi
"""

[tasks.e2e]
description = "Run the Bruno API suite against E2E_BASE_URL (default http://localhost:8080)"
dir = "api"
run = 'bru run --env ci --env-var "baseUrl=${E2E_BASE_URL:-http://localhost:8080}" --reporter-junit "${E2E_RESULTS:-e2e-results.xml}"'
