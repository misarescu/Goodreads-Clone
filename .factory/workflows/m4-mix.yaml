# Frankie M4 acceptance (docs/spec/10): one workflow that mixes Claude Code,
# opencode and pi on Anthropic and OpenRouter.
name: m4-mix
version: 1
steps:
  - id: implement
    agent: { role: coder, harness: claude-code, model: anthropic/claude-sonnet-5-5 }
  - id: document
    agent: { role: doc-writer, harness: opencode, model: openrouter/openai/gpt-5.6-luna }
  - id: checks
    gate:
      type: command
      run: ["mise run lint", "mise run test"]
      onFail: { goto: implement, maxLoops: 2 }
  - id: review
    parallel:
      - agent: { role: code-reviewer, harness: pi, model: openrouter/openai/gpt-5.6-terra }
    gate:
      type: agent-verdict
      require: all
      onFail: { goto: implement, maxLoops: 1 }
  - id: open-change-request
    action: change-request.open
