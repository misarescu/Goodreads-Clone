dependencies:
  files: [go.mod, go.sum, go-packages.txt, frontend/package.json, frontend/bun.lock]
  run: mise run deps:warm
egress:
  # nodejs.org: Node for the toolchain; registry.npmjs.org: the Bruno CLI.
  allow: [nodejs.org, registry.npmjs.org]
# Issues run Frankie's build-e2e (D122): an e2e test writer adds API suite
# requests for the issue from its spec, at the same time as the coder, and
# `mise run e2e:local` runs the suite against the change before review. Bugs
# keep the bug-fix workflow, which naming a workflow would otherwise replace.
workflow: build-e2e
workflows: {bug: bug-fix}
# The API suite, run against a stage that verifies a release with e2e-suite
# (Frankie D116), and the suite the e2e test writer adds to.
e2e:
  command: mise run e2e
# Where a merged commit is released (Frankie D113, D117). Staging runs on the
# homelab, deployed by its Flux from misarescu/Goodreads-CD; the factory commits
# the release's image tag there, waits until the stage reports the commit, and
# rolls back by committing the previous tag. It reaches the stage over the
# tailnet through the Tailscale egress Service on its cluster (Frankie D118).
# Once the stage reports the commit, the factory runs the API suite against it
# (verify: e2e-suite, Frankie D116); a failure rolls the stage back and opens a
# bug issue. The suite cleans up after itself, so it passes again and again
# against the stage's kept data (gc-71, gc-72).
stages:
  # Before the merge queue, each change request's head is checked in a preview
  # of it (Frankie D124-D126): the flux-preview driver adds the head's image to
  # the ResourceSet inputs in misarescu/Goodreads-CD, the homelab's Flux runs it
  # in its own namespace, and the factory reaches it over the tailnet at
  # /pr-<number>/ on the previews proxy. Once it reports the head, the API suite
  # runs against it; failures go back to the coder. The preview is removed after
  # the check. At most two run at once; a third change request waits for room.
  - name: preview
    driver: flux-preview
    url: http://goodreads-previews.stages.svc.cluster.local/pr-{changeRequest}
    verify: e2e-suite
    config:
      repo: misarescu/Goodreads-CD
      path: apps/goodreads/previews/inputs.yaml
      versionURL: http://goodreads-previews.stages.svc.cluster.local/pr-{changeRequest}/api/version
  - name: staging
    driver: flux
    url: http://goodreads-stg.stages.svc.cluster.local
    rollback: true
    verify: e2e-suite
    config:
      repo: misarescu/Goodreads-CD
      path: apps/goodreads/staging/kustomization.yaml
      image: ghcr.io/misarescu/goodreads-clone
      versionURL: http://goodreads-stg.stages.svc.cluster.local/api/version
