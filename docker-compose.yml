services:
  migrate:
    image: alpine:latest
    volumes:
      - sqlite_data:/data
      - ./db/migrations:/migrations:ro
    command: >
      sh -c "
        apk add --no-cache sqlite &&
        echo 'Running migrations...' &&
        for file in /migrations/*.sql; do
          echo \"Applying \$$file...\";
          sqlite3 /data/goodreads.db < \$$file;
        done &&
        echo 'Migrations complete'
      "

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_PATH=/data/goodreads.db
    volumes:
      - sqlite_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sqlite_data:
