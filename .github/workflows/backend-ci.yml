name: Backend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.25.5"
  GOLANGCI_LINT_VERSION: "v2.8"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m 

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js (for Bruno CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: make install-deps-backend

      - name: Generate mocks
        run: make gen-mocks

      - name: Run unit tests
        run: make test

      - name: Generate coverage report
        run: make coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 3

      - name: Build backend for E2E
        run: make backend-build

      - name: Run database migrations
        run: make migrate
        env:
          DATABASE_PATH: goodreads.db

      - name: Start server in background
        run: |
          ./bin/goodreads &
          echo $! > server.pid
        env:
          DATABASE_PATH: goodreads.db
          SERVER_ADDR: :8080

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:8080/api/users?limit=1 > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Server not ready yet..."
            sleep 2
          done
          echo "Server failed to start in time"
          exit 1

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno E2E tests
        run: bru run --reporter-html e2e-results.html --reporter-json e2e-results.json
        working-directory: api

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            api/e2e-results.html
            api/e2e-results.json
          retention-days: 3

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi
