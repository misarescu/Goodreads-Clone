name: Publish image

# Every pull request and every push to main gets an image tagged with its
# commit, which deployments (previews, staging, production) pin to.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/misarescu/goodreads-clone

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compute tags
        id: meta
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A pull request builds a merge commit; tag the PR's own head commit.
          sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          short="${sha:0:7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${short}"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "${IMAGE}:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.short }}
          tags: ${{ steps.meta.outputs.tags }}
