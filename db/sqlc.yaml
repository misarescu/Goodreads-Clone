version: "2"
sql:
  - engine: "sqlite"
    queries: "queries/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "../internal/db"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - column: "shelf_books.finished_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
